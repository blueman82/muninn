[tool.black]
line-length = 79
target-version = ["py313"]

[tool.ruff]
line-length = 79
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"hooks/codex.py" = ["E402"]
"scripts/claude_context.py" = ["E402"]

[tool.isort]
profile = "black"
line_length = 79

[tool.pytest.ini_options]
testpaths = ["tests"]
