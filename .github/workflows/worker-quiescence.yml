name: PR68 cleanup observation one-shot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr68-cleanup-observation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-linux:
    if: github.ref == 'refs/heads/diagnostic/pr68-cleanup-observation-one-shot'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      MUNINN_CLEANUP_OBSERVATION_DIR: ${{ runner.temp }}/pr68-cleanup-observation
      MUNINN_CLEANUP_OBSERVATION_WORKTREE: ${{ runner.temp }}/pr68-cleanup-source
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.txt
      - name: Provision supported SQLite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sqlite_build="$RUNNER_TEMP/muninn-sqlite"
          mkdir -p "$sqlite_build"
          curl --fail --silent --show-error --retry 3 \
            https://sqlite.org/2025/sqlite-amalgamation-3500400.zip \
            -o "$sqlite_build/source.zip"
          unzip -q "$sqlite_build/source.zip" -d "$sqlite_build"
          python3.13 - "$sqlite_build" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]) / 'sqlite-amalgamation-3500400/sqlite3.c'
          expected = '9145255e83da6529e70121ee4d7a4c88fe83ca4511da0c9ed13d10842df36782'
          assert hashlib.sha3_256(source.read_bytes()).hexdigest() == expected
          PY
          cc -O2 -fPIC -shared -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_COLUMN_METADATA \
            -Wl,-soname,libsqlite3.so.0 \
            "$sqlite_build/sqlite-amalgamation-3500400/sqlite3.c" \
            -o "$sqlite_build/libsqlite3.so.0" -lm -lpthread -ldl
          echo "LD_LIBRARY_PATH=$sqlite_build" >> "$GITHUB_ENV"
      - name: Verify provisioned SQLite on Linux
        if: runner.os == 'Linux'
        shell: python
        run: |
          import sqlite3
          assert sqlite3.sqlite_version_info == (3, 50, 4), sqlite3.sqlite_version
          print('Verified SQLite', sqlite3.sqlite_version)
      - name: Verify interpreter and SQLite FTS5 readiness
        shell: python
        run: |
          import json
          import os
          import platform
          import sqlite3
          import sys
          from pathlib import Path

          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.machine().lower() in {
              'x86_64', 'amd64', 'arm64', 'aarch64'
          }, platform.machine()
          with sqlite3.connect(':memory:') as conn:
              conn.execute('CREATE VIRTUAL TABLE readiness USING fts5(body)')
              conn.execute("INSERT INTO readiness VALUES ('synthetic readiness')")
              assert conn.execute(
                  "SELECT count(*) FROM readiness WHERE readiness MATCH 'synthetic'"
              ).fetchone() == (1,)
          result = {
              'sha': os.environ['GITHUB_SHA'],
              'os': platform.platform(),
              'architecture': platform.machine(),
              'python': platform.python_version(),
              'sqlite': sqlite3.sqlite_version,
              'check': 'environment readiness; no Windows support claim',
          }
          print(json.dumps(result))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Interpreter and SQLite FTS5 readiness passed.\n\n'
              'Windows readiness does not validate Muninn runtime, installation, '
              'provider integration, Windows 11 x64, or WSL.\n\n'
              + '```json\n' + json.dumps(result, indent=2) + '\n```\n',
              encoding='utf-8',
          )
      - name: Create private native proof scratch
        id: native_scratch
        if: runner.os != 'macOS'
        shell: python
        run: |
          import os
          import tempfile
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from muninn import platform_io

          root = Path(tempfile.mkdtemp(prefix='muninn-native-proof-')).resolve()
          platform_io.ensure_private_dir(root)
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('root=' + str(root) + '\n')
      - name: Provision private Linux proof interpreter when required
        id: native_python
        if: runner.os == 'Linux' && !cancelled()
        env:
          MUNINN_NATIVE_SCRATCH: ${{ steps.native_scratch.outputs.root }}
        shell: bash
        run: python3.13 -m tests.lifecycle_native_python
      - name: Install full gate tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3.13 -m venv .venv
          .venv/bin/python3.13 -m pip install --require-hashes -r requirements-runtime.lock
          .venv/bin/python3.13 -m pip install --require-hashes -r requirements-dev.txt
          if ! command -v shellcheck >/dev/null; then
            if [[ "$RUNNER_OS" == 'macOS' ]]; then
              brew install shellcheck
            else
              sudo apt-get update
              sudo apt-get install --yes shellcheck
            fi
          fi
          git config core.hooksPath .githooks
      - name: Run real isolated Linux lifecycle
        if: runner.os == 'Linux'
        env:
          MUNINN_NATIVE_SCRATCH: ${{ steps.native_scratch.outputs.root }}
        shell: bash
        run: |
          sudo systemd-run --pipe --wait --collect --quiet --property=Delegate=yes \
            --property=SendSIGKILL=no --property=TimeoutStopSec=infinity \
            --uid="$(id -u)" --gid="$(id -g)" --working-directory="$PWD" \
            env PATH="$PATH" LD_LIBRARY_PATH="$LD_LIBRARY_PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" MUNINN_NATIVE_SCRATCH="$MUNINN_NATIVE_SCRATCH" \
            dbus-run-session -- "${{ steps.native_python.outputs.executable }}" -m tests.lifecycle_native
      - name: Provision pinned Codex native proof
        id: provider_setup
        if: runner.os != 'macOS' && !cancelled()
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, '-m', 'tests.provider_native_setup'], check=True)
      - name: Run actual Codex and rendered provider routes
        if: runner.os != 'macOS' && !cancelled() && steps.provider_setup.outcome == 'success'
        env:
          MUNINN_NATIVE_SCRATCH: ${{ steps.native_scratch.outputs.root }}
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, '-m', 'tests.provider_native'], check=True)
      - name: Upload early native proof codes
        if: runner.os != 'macOS' && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-proof-codes-ubuntu-24.04
          path: |
            ${{ steps.native_scratch.outputs.root }}/muninn-native-diagnostics/muninn-lifecycle-proof.json
            ${{ steps.native_scratch.outputs.root }}/muninn-native-diagnostics/muninn-provider-proof.json
            ${{ steps.native_scratch.outputs.root }}/muninn-native-diagnostics/muninn-ordinary-proof.json
            ${{ steps.native_scratch.outputs.root }}/muninn-native-diagnostics/muninn-recovery-probe.json
          if-no-files-found: error
          retention-days: 30
      - name: Apply the reviewed hosted-only source overlay
        id: observation_overlay
        shell: bash
        run: .venv/bin/python3.13 -m tools.pr68_observation_overlay
      - name: Bind loaded preparation sources and startup inputs
        id: observation_binding
        working-directory: ${{ env.MUNINN_CLEANUP_OBSERVATION_WORKTREE }}
        shell: bash
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python3.13 -m tools.pr68_observation_binding
      - name: Run mandatory full gate
        if: success() && !cancelled() && steps.observation_overlay.outcome == 'success' && steps.observation_binding.outcome == 'success'
        working-directory: ${{ env.MUNINN_CLEANUP_OBSERVATION_WORKTREE }}
        shell: bash
        run: |
          trap 'result=$?; if [[ "$result" != 130 ]]; then printf "%s\n" "$result" > "$MUNINN_CLEANUP_OBSERVATION_DIR/suite.exit"; fi; exit "$result"' EXIT
          PATH="$PWD/.venv/bin:$PATH" .venv/bin/python3.13 -m tools.check --full
      - name: Retain actual post-suite source equality and missing evidence
        if: always()
        working-directory: ${{ env.MUNINN_CLEANUP_OBSERVATION_WORKTREE }}
        shell: bash
        run: .venv/bin/python3.13 -m tools.pr68_observation_binding after
      - name: Retain complete observation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr68-cleanup-observation-${{ github.sha }}
          path: ${{ runner.temp }}/pr68-cleanup-observation
          if-no-files-found: error
          retention-days: 30
