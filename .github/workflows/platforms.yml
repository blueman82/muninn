name: Platform validation

on:
  push:
    branches: [main, codex/windows-support-plan]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    name: ${{ matrix.runner }} / ${{ matrix.check }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            check: full gate
          - runner: ubuntu-24.04
            architecture: x64
            check: full gate
          - runner: windows-2022
            architecture: x64
            check: native runtime primitives
          - runner: windows-11-arm
            architecture: arm64
            check: native runtime primitives
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: ${{ matrix.architecture }}
      - name: Provision supported SQLite on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sqlite_build="$RUNNER_TEMP/muninn-sqlite"
          mkdir -p "$sqlite_build"
          curl --fail --silent --show-error --retry 3 \
            https://sqlite.org/2025/sqlite-amalgamation-3500400.zip \
            -o "$sqlite_build/source.zip"
          unzip -q "$sqlite_build/source.zip" -d "$sqlite_build"
          python3.13 - "$sqlite_build" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          source = Path(sys.argv[1]) / 'sqlite-amalgamation-3500400/sqlite3.c'
          expected = '9145255e83da6529e70121ee4d7a4c88fe83ca4511da0c9ed13d10842df36782'
          assert hashlib.sha3_256(source.read_bytes()).hexdigest() == expected
          PY
          cc -O2 -fPIC -shared -DSQLITE_ENABLE_FTS5 -DSQLITE_ENABLE_COLUMN_METADATA \
            -Wl,-soname,libsqlite3.so.0 \
            "$sqlite_build/sqlite-amalgamation-3500400/sqlite3.c" \
            -o "$sqlite_build/libsqlite3.so.0" -lm -lpthread -ldl
          echo "LD_LIBRARY_PATH=$sqlite_build" >> "$GITHUB_ENV"
      - name: Verify provisioned SQLite on Linux
        if: runner.os == 'Linux'
        shell: python
        run: |
          import sqlite3
          assert sqlite3.sqlite_version_info == (3, 50, 4), sqlite3.sqlite_version
          print('Verified SQLite', sqlite3.sqlite_version)
      - name: Verify interpreter and SQLite FTS5 readiness
        shell: python
        run: |
          import json
          import os
          import platform
          import sqlite3
          import sys
          from pathlib import Path

          assert sys.version_info[:2] == (3, 13), sys.version
          assert platform.machine().lower() in {
              'x86_64', 'amd64', 'arm64', 'aarch64'
          }, platform.machine()
          with sqlite3.connect(':memory:') as conn:
              conn.execute('CREATE VIRTUAL TABLE readiness USING fts5(body)')
              conn.execute("INSERT INTO readiness VALUES ('synthetic readiness')")
              assert conn.execute(
                  "SELECT count(*) FROM readiness WHERE readiness MATCH 'synthetic'"
              ).fetchone() == (1,)
          result = {
              'sha': os.environ['GITHUB_SHA'],
              'os': platform.platform(),
              'architecture': platform.machine(),
              'python': platform.python_version(),
              'sqlite': sqlite3.sqlite_version,
              'check': 'environment readiness; no Windows support claim',
          }
          print(json.dumps(result))
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text(
              'Interpreter and SQLite FTS5 readiness passed.\n\n'
              'Windows readiness does not validate Muninn runtime, installation, '
              'provider integration, Windows 11 x64, or WSL.\n\n'
              + '```json\n' + json.dumps(result, indent=2) + '\n```\n',
              encoding='utf-8',
          )
      - name: Install full gate tools
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3.13 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          if ! command -v shellcheck >/dev/null; then
            if [[ "$RUNNER_OS" == 'macOS' ]]; then
              brew install shellcheck
            else
              sudo apt-get update
              sudo apt-get install --yes shellcheck
            fi
          fi
          git config core.hooksPath .githooks
      - name: Run mandatory full gate
        if: runner.os != 'Windows'
        shell: bash
        run: python3.13 -m tools.check --full
      - name: Install native gate tools
        if: runner.os == 'Windows'
        shell: python
        run: |
          import hashlib
          import io
          import os
          import subprocess
          import sys
          import urllib.request
          import zipfile
          from pathlib import Path

          subprocess.run([sys.executable, '-m', 'venv', '.venv'], check=True)
          python = str(Path('.venv/Scripts/python.exe'))
          subprocess.run([python, '-m', 'pip', 'install', '-r',
                          'requirements-dev.txt'], check=True)
          url = 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.zip'
          expected = '8a4e35ab0b331c85d73567b12f2a444df187f483e5079ceffa6bda1faa2e740e'
          archive = urllib.request.urlopen(url, timeout=60).read()
          assert hashlib.sha256(archive).hexdigest() == expected
          tools = Path(os.environ['RUNNER_TEMP']) / 'muninn-native-tools'
          tools.mkdir(exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              members = [name for name in source.namelist()
                         if name.endswith('shellcheck.exe')]
              assert len(members) == 1, members
              (tools / 'shellcheck.exe').write_bytes(source.read(members[0]))
          subprocess.run([str(tools / 'shellcheck.exe'), '--version'], check=True)
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as path:
              path.write(str(tools) + '\n')
          subprocess.run(['git', 'config', 'core.hooksPath', '.githooks'], check=True)
      - name: Run mandatory native runtime safety checks
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run(
              [sys.executable, '-m', 'unittest', 'tests.test_platform_lock',
               'tests.test_file_sync', 'tests.test_platform_io',
               'tests.test_platform_windows', 'tests.test_windows_runtime',
               'tests.test_platform_paths', 'tests.test_poller_stop',
               'tests.test_sqlite_privacy', 'tests.test_native_tools',
               'tests.test_native_launcher', 'tests.test_residue_portability'], check=True,
          )
      - name: Check Windows native API typing
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          subprocess.run([str(Path('.venv/Scripts/python.exe')), '-m', 'pyright', '--pythonplatform',
                          'Windows', 'muninn'], check=True)
      - name: Run mandatory native full gate
        if: runner.os == 'Windows' && !cancelled()
        shell: python
        run: |
          import subprocess
          import sys
          subprocess.run([sys.executable, '-m', 'tools.check', '--full'], check=True)
