name: macOS check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.lock
            requirements-dev.txt
      - name: Install gate tools
        run: |
          python3.13 -m venv .venv
          .venv/bin/python3.13 -m pip install --require-hashes -r requirements-runtime.lock
          .venv/bin/python3.13 -m pip install --require-hashes -r requirements-dev.txt
          command -v shellcheck >/dev/null || brew install shellcheck
          git config core.hooksPath .githooks
      - name: Run full gate
        run: PATH="$PWD/.venv/bin:$PATH" .venv/bin/python3.13 -m tools.check --full
